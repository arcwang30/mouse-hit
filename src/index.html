<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>鋼拳風雲錄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cyber-ui.css">
  <link rel="stylesheet" href="css/menu-pages.css">
</head>
<body>
<div id="app">

  <!-- 選單類畫面共用的動態背景(呼吸縮放 + 細雨 + 火星),只在 .art 畫面顯示 -->
  <div id="artBg"><div class="art-img"></div><div class="rain"></div><div class="embers" id="artEmbers"></div></div>

  <!-- 故事開場 -->
  <section id="story" class="screen">
    <div class="story-dots" id="storyDots"></div>
    <div class="story-stage">
      <div class="story-panel" id="storyPanel"><div class="panel-img" id="panelImg"></div><div class="panel-fx"></div></div>
    </div>
    <div class="story-caption" id="storyCaption"><span class="speaker" id="storySpeaker"></span><p id="storyText"></p></div>
    <div class="story-hint">點擊畫面繼續</div>
    <button class="skip" id="storySkip">跳過 ▶▶</button>
  </section>

  <!-- 標題畫面 -->
  <section id="title" class="screen">
    <div class="title-bg"></div>
    <div class="rain"></div>
    <div class="embers" id="embers"></div>
    <div class="bolt"></div>
    <div class="title-logo"><img src="../assets/images/ui/logo.webp" alt="鋼拳風雲錄"></div>
    <div class="title-start">點擊畫面開始<small>TAP TO START</small></div>
  </section>

  <!-- 主選單 -->
  <section id="menu" class="screen art">
    <div class="menu-logo"><img src="../assets/images/ui/logo.webp" alt="鋼拳風雲錄"></div>
    <div class="menu-points">成長點數:<b id="menuPoints">0</b></div>
    <button class="btn start" id="btnStart"><span>開始遊戲</span><small>START</small></button>
    <div class="menu-grid">
      <button class="btn small" id="btnUpgrade">💪 成長</button>
      <button class="btn small" id="btnHowto">🎮 操作說明</button>
      <button class="btn small" id="btnSettings">⚙️ 設定</button>
      <button class="btn small" id="btnStory">📜 故事</button>
      <button class="btn small" id="btnHistory">📖 了解歷史</button>
      <button class="btn small" id="btnCredits">⭐ CREDIT</button>
    </div>
    <div class="copyright">©Arc's Concept Game</div>
  </section>

  <!-- 選擇關卡 -->
  <section id="stages" class="screen art page">
    <header class="pg-head"><h2>選擇關卡</h2><div class="pg-sub">STAGE SELECT</div></header>
    <div id="stageList" class="stage-list"></div>
    <div class="pg-foot"><button class="btn small" data-back>返回</button></div>
  </section>

  <!-- 操作說明 -->
  <section id="howto" class="screen art page">
    <header class="pg-head"><h2>操作說明</h2><div class="pg-sub" id="howtoSub"></div></header>
    <div class="pg-panel" id="howtoBody"></div>
    <div class="pg-foot">
      <button class="pg-arrow" id="howtoPrev">◀</button>
      <button class="btn small" data-back>返回</button>
      <button class="pg-arrow" id="howtoNext">▶</button>
    </div>
  </section>

  <!-- 設定 -->
  <section id="settings" class="screen art page">
    <header class="pg-head"><h2>設定</h2><div class="pg-sub">SETTINGS</div></header>
    <div class="pg-panel" id="settingsBody"></div>
    <div class="pg-foot"><button class="btn small" data-back>返回</button></div>
  </section>

  <!-- 了解歷史 -->
  <section id="history" class="screen art page">
    <header class="pg-head"><h2>了解歷史</h2></header>
    <div class="pg-tabs" id="historyTabs"></div>
    <div class="pg-panel scroll" id="historyBody"></div>
    <a class="btn small fb" id="fbLink" target="_blank" rel="noopener noreferrer">前往 Facebook 粉絲團</a>
    <div class="pg-foot"><button class="btn small" data-back>返回</button></div>
  </section>

  <!-- CREDIT -->
  <section id="credits" class="screen art page">
    <header class="pg-head"><h2>CREDIT</h2><div class="pg-sub">製作名單</div></header>
    <div class="pg-panel" id="creditsBody"></div>
    <div class="pg-foot"><button class="btn small" data-back>返回</button></div>
  </section>

  <!-- 成長升級 -->
  <section id="upgrade" class="screen art">
    <h2>永久成長</h2>
    <div class="menu-points">成長點數:<b id="upPoints">0</b></div>
    <div id="upList" class="up-list"></div>
    <button class="btn" id="upBack">返回</button>
  </section>

  <!-- 戰鬥 -->
  <section id="battle" class="screen">
    <div class="stage" id="stageView">
      <div class="stage-bg" id="stageBg"></div>
      <div class="deco" id="deco"></div>
      <div class="wave-tag" id="waveTag">WAVE 1/3</div>
      <div class="combo" id="combo"><b id="comboNum">0</b><span>COMBO</span><div class="fever-bar"><i id="feverFill"></i></div></div>
      <div class="enemy idle" id="enemy">
        <div class="sprite" id="enemySprite">🧘</div>
        <div class="state-tag" id="enemyState">待機</div>
      </div>
      <div class="enemy-info">
        <div class="enemy-name" id="enemyName">武僧</div>
        <div class="bar enemy-bar"><div class="fill" id="enemyHpFill"></div><span id="enemyHpText"></span></div>
      </div>
    </div>

    <div class="hud">
      <div class="hud-row">
        <div class="bar player-bar"><div class="fill" id="playerHpFill"></div><span id="playerHpText"></span></div>
        <div class="counter" title="反應次數倒數">剩餘 <b id="counter">-</b></div>
      </div>
      <div class="hud-row">
        <div class="bar ult-bar"><div class="fill" id="ultFill"></div><span id="ultText"></span></div>
        <button class="ult-btn" id="ultBtn" disabled>🔥 必殺</button>
      </div>
      <div class="phase" id="phase">準備</div>
      <div class="timebar"><div class="fill" id="timeFill"></div></div>
    </div>

    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
  </section>

  <!-- 結算 -->
  <section id="result" class="screen art">
    <h2 id="resultTitle">過關!</h2>
    <div class="result-box" id="resultBox"></div>
    <button class="btn" id="resultBack">返回主選單</button>
  </section>

  <!-- 覆蓋層 -->
  <div id="skillPick" class="overlay">
    <h2>選擇一項技能</h2>
    <div id="skillCards" class="skill-cards"></div>
  </div>
  <div id="branch" class="overlay">
    <h2>選擇路線</h2>
    <div class="branch-sub">兩條路,只能走一條</div>
    <div id="branchCards" class="branch-cards"></div>
  </div>
  <div id="banner" class="overlay banner"><div class="banner-main" id="bannerMain"></div><div class="banner-sub" id="bannerSub"></div></div>
  <div id="cutin" class="overlay cutin">
    <div class="speed-lines"></div>
    <img class="cutin-art" src="../assets/images/fx/ult_cutin.webp" alt="" draggable="false">
    <div class="cutin-title">烈焰鋼拳・焚天</div>
    <div class="cutin-sub">額上烈焰烙痕,燃盡一切!</div>
  </div>
  <div id="hurtFlash"></div>
  <button class="mute" id="muteBtn" title="靜音(M)">🔊</button>
</div>

<script src="js/core.js"></script>
<script src="js/audio/engine.js"></script>
<script src="js/audio/bgm.js"></script>
<script src="js/data/skills.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/stages.js"></script>
<script src="js/data/upgrades.js"></script>
<script src="js/battle/grid.js"></script>
<script src="js/battle/battle.js"></script>
<script src="js/data/pages.js"></script>
<script src="js/scenes/scenes.js"></script>
<script src="js/scenes/pages.js"></script>
<script src="js/main.js"></script>
</body>
</html>
